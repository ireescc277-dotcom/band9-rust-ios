name: Warframe iOS Device Build (signed)

# 手动触发。需要 Apple 签名材料，公开仓库的 macOS runner 本身免费。
# Secrets: CERT_P12_BASE64 / CERT_PASSWORD / MOBILEPROVISION_BASE64 / TEAM_ID
#
# 本机这套材料是 Ad Hoc 描述文件，绑定的 App ID 为显式 ID 而非通配。
# 因此构建时会从描述文件反推 BUNDLE_ID 与 EXPORT_METHOD，覆盖 project.yml
# 里的 com.workbuddy.warframeworldstate；模拟器 workflow 不受影响。
on:
  workflow_dispatch:
  # 本 workflow 只存在于 warframe-worldstate 分支，默认分支没有副本，
  # GitHub 不会注册它，导致首次 workflow_dispatch 返回 404。
  # 这条 push 规则用于让文件自身的一次更新产生首条运行记录；
  # 注册完成后即可正常用 workflow_dispatch 触发。
  push:
    branches: [warframe-worldstate]
    paths:
      - '.github/workflows/warframe-ios-device.yml'

permissions:
  contents: read

concurrency:
  group: warframe-ios-device-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          P12: ${{ secrets.CERT_P12_BASE64 }}
          P12PW: ${{ secrets.CERT_PASSWORD }}
          PROV: ${{ secrets.MOBILEPROVISION_BASE64 }}
          TEAM: ${{ secrets.TEAM_ID }}
        run: |
          if [ -z "$P12" ] || [ -z "$P12PW" ] || [ -z "$PROV" ] || [ -z "$TEAM" ]; then
            echo "::error::需要配置 Secrets: CERT_P12_BASE64, CERT_PASSWORD, MOBILEPROVISION_BASE64, TEAM_ID"
            exit 1
          fi

      - name: Prepare bundle resources
        run: python3 warframe-worldstate/ios/prepare.py

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi

      - name: Import certificate and provisioning profile
        env:
          P12: ${{ secrets.CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.CERT_PASSWORD }}
          PROV: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/wf-build.keychain-db"
          security create-keychain -p "$RUNNER_TEMP" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$RUNNER_TEMP" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          # -A 允许 CI 中的 codesign 直接访问私钥，避免 ACL 拦截
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -A

          echo "$PROV" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          # p12 只含 leaf 证书；从描述文件的 CMS 里取出 Apple WWDR G3 链补进钥匙串
          openssl pkcs7 -inform DER -in "$RUNNER_TEMP/app.mobileprovision" \
            -print_certs -out "$RUNNER_TEMP/chain.pem" 2>/dev/null || true
          if [ -s "$RUNNER_TEMP/chain.pem" ]; then
            security import "$RUNNER_TEMP/chain.pem" -k "$KEYCHAIN" -A
          fi

          # 保留系统钥匙串，并确认可用的签名身份
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$RUNNER_TEMP" "$KEYCHAIN" >/dev/null
          security find-identity -v -p codesigning "$KEYCHAIN"

          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/prov.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/prov.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/app.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

          # 描述文件决定 bundle id 与导出方式：显式 App ID 必须完全对齐，否则 archive 会失败
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/prov.plist")
          PREFIX=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationIdentifierPrefix:0' "$RUNNER_TEMP/prov.plist")
          BUNDLE_ID="${APP_ID#"$PREFIX".}"
          if [ -z "$BUNDLE_ID" ] || [[ "$BUNDLE_ID" == *"*"* ]]; then
            BUNDLE_ID="com.workbuddy.warframeworldstate"
          fi
          if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$RUNNER_TEMP/prov.plist" >/dev/null 2>&1; then
            EXPORT_METHOD="ad-hoc"
          else
            EXPORT_METHOD="app-store"
          fi
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "EXPORT_METHOD=$EXPORT_METHOD" >> "$GITHUB_ENV"
          echo "描述文件 App ID: $BUNDLE_ID / 导出方式: $EXPORT_METHOD"

      - name: Generate Xcode project
        working-directory: warframe-worldstate/ios
        run: xcodegen generate

      - name: Archive (unsigned)
        working-directory: warframe-worldstate/ios
        run: |
          # 不签名归档时 Xcode 不会替换 Info.plist 里的 $(PRODUCT_BUNDLE_IDENTIFIER)，
          # 直接写入描述文件对应的实际 App ID，避免 "Archive Missing Bundle Identifier"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" WarframeWorldState/Info.plist
          # 让 Xcode 只负责编译，签名交给下一步手动执行
          xcodebuild \
            -project WarframeWorldState.xcodeproj \
            -scheme WarframeWorldState \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/WarframeWorldState.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            ASSETCATALOG_COMPILER_APPICON_NAME="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Sign and package IPA
        run: |
          KEYCHAIN="$RUNNER_TEMP/wf-build.keychain-db"
          APP="$RUNNER_TEMP/WarframeWorldState.xcarchive/Products/Applications/WarframeWorldState.app"
          if [ ! -d "$APP" ]; then echo "::error::archive 中未找到 .app"; exit 1; fi

          # Xcode 为旧版 iOS 生成的散装图标会让 codesign 校验失败，去掉后再签名
          rm -rf "$APP"/AppIcon*.png
          cp "$RUNNER_TEMP/app.mobileprovision" "$APP/embedded.mobileprovision"

          # entitlements 只需是描述文件的子集
          python3 -c '
          import plistlib, os
          t = os.environ["RUNNER_TEMP"]
          e = plistlib.load(open(os.path.join(t, "prov.plist"), "rb"))["Entitlements"]
          keys = ["application-identifier", "com.apple.developer.team-identifier",
                  "get-task-allow", "keychain-access-groups", "aps-environment"]
          out = {k: e[k] for k in keys if k in e}
          plistlib.dump(out, open(os.path.join(t, "ent.plist"), "wb"))
          print("entitlements:", ", ".join(out))
          '

          CERT=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -m1 -oE '[0-9A-F]{40}' || true)
          if [ -z "$CERT" ]; then echo "::error::钥匙串中没有可用签名身份"; exit 1; fi
          codesign --force --sign "$CERT" \
            --keychain "$KEYCHAIN" \
            --entitlements "$RUNNER_TEMP/ent.plist" \
            --timestamp=none "$APP"
          codesign --verify --verbose=2 "$APP"

          mkdir -p "$RUNNER_TEMP/payload/Payload" out
          cp -R "$APP" "$RUNNER_TEMP/payload/Payload/"
          (cd "$RUNNER_TEMP/payload" && zip -qr "$GITHUB_WORKSPACE/out/WarframeWorldState-device.ipa" Payload)
          ls -lh out/WarframeWorldState-device.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: WarframeWorldState-device-ipa
          path: out/WarframeWorldState-device.ipa
          if-no-files-found: error
